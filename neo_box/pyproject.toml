[project]
name = "neo-box"
version = "0.1.0"
description = "Neo Box - daemon e-ink + boutons de la box domotique Neo (add-on Home Assistant OS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.0",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213",   # incompatibles avec D211/D212 (un seul style de docstring)
    "COM812",         # gere par le formateur
    "CPY001",         # pas de bandeau de copyright dans ce monorepo
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "INP001", "D", "ANN401"]  # JSON de test = Any
"tests/conftest.py" = ["N815"]  # do_GET / do_POST : noms imposes par http.server
"tools/*" = ["T201", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*", "waveshare_epd", "waveshare_epd.*", "gpiozero", "gpiozero.*"]
ignore_missing_imports = true
