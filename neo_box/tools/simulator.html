<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Neo Box — simulateur</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #15181d; color: #e8eaed; display: grid; grid-template-columns: 560px 1fr; gap: 24px; padding: 24px; }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .08em; text-transform: uppercase; color: #9aa0a6; }
  .box { background: #23272e; border-radius: 22px; padding: 26px; box-shadow: inset 0 1px 0 #3a3f47, 0 20px 40px #0008; }
  .screen { width: 500px; height: 244px; image-rendering: pixelated; background: #fff; border: 6px solid #0b0c0f; border-radius: 6px; display: block; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; margin: 22px auto 0; }
  .pad button, .side button { font: inherit; background: #2f343c; color: #e8eaed; border: 0; border-radius: 10px; cursor: pointer; }
  .pad button:active, .side button:active { background: #0d6efd; }
  .pad .ok { background: #0d6efd; font-weight: 700; }
  .side { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
  .side button { padding: 8px 16px; }
  .panel { background: #1b1f25; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
  select, input { font: inherit; background: #2f343c; color: inherit; border: 0; border-radius: 6px; padding: 4px 8px; width: 150px; }
  code { color: #ffc500; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #2f343c; margin-right: 6px; }
  .pill.on { background: #1e6b3a; } .pill.err { background: #7a1f1f; }
  #actions { font-family: ui-monospace, monospace; font-size: 12px; color: #9aa0a6; white-space: pre-line; }
</style>
</head>
<body>
<div>
  <h1>Face avant</h1>
  <div class="box">
    <img id="screen" class="screen" src="/screen.png" alt="ecran e-ink">
    <div class="pad">
      <span></span><button data-key="UP">▲</button><span></span>
      <button data-key="LEFT">◀</button><button class="ok" data-key="OK">OK</button><button data-key="RIGHT">▶</button>
      <span></span><button data-key="DOWN">▼</button><span></span>
    </div>
    <div class="side"><button data-key="BACK">Retour</button></div>
  </div>
</div>
<div>
  <h1>Coulisses</h1>
  <div class="panel" id="status"></div>
  <div class="panel">
    <label>Internet <select data-field="internet"><option>up</option><option>down</option><option>unknown</option></select></label>
    <label>Cloud Neo <select data-field="cloud"><option>up</option><option>down</option><option>unknown</option></select></label>
    <label>Acces distant <select data-field="mesh"><option>up</option><option>down</option><option>unknown</option></select></label>
    <label>Home Assistant <select data-field="home_assistant"><option>running</option><option>unresponsive</option><option>stopped</option><option>unknown</option></select></label>
    <label>Antenne Zigbee <select data-field="zigbee_coordinator"><option>up</option><option>down</option><option>unknown</option></select></label>
    <label>Appareils Zigbee <input type="number" data-field="zigbee_devices" value="7"></label>
    <label>Disque libre % <input type="number" data-field="disk_free_percent" value="61"></label>
    <label>Temperature CPU <input type="number" data-field="cpu_temperature_c" value="47"></label>
    <label>Mise a jour echouee <input type="checkbox" data-field="last_update_failed"></label>
  </div>
  <div class="panel">
    <button id="reset">Remettre la box a neuf (nouveau jeton)</button>
  </div>
  <div class="panel"><div id="actions"></div></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const refreshScreen = () => { $('#screen').src = '/screen.png?t=' + Date.now(); };
  const render = (info) => {
    const pill = (label, on, err) => `<span class="pill ${err ? 'err' : on ? 'on' : ''}">${label}</span>`;
    $('#status').innerHTML =
      `<div>${pill(info.enrolled ? 'ENROLEE' : 'NON ENROLEE', info.enrolled)} ${pill('mode ' + info.mode, true)} ${info.error ? pill(info.error, false, true) : pill('aucune erreur', true)}</div>` +
      `<div style="margin-top:8px">Jeton : <code>${info.token}</code> — QR : <code>${info.qr}</code></div>` +
      `<div>Backend : <code>${info.backend || 'aucun (mode autonome)'}</code>${info.api_key_prefix ? ' — cle <code>' + info.api_key_prefix + '</code>' : ''}</div>`;
  };
  const post = async (url, body) => {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    render(await res.json()); refreshScreen();
  };
  document.querySelectorAll('[data-key]').forEach((b) => b.addEventListener('click', () => post('/key/' + b.dataset.key)));
  document.querySelectorAll('[data-field]').forEach((el) => el.addEventListener('change', () => {
    const value = el.type === 'checkbox' ? el.checked : el.value;
    post('/state', { [el.dataset.field]: value });
  }));
  $('#reset').addEventListener('click', () => post('/reset'));
  setInterval(refreshScreen, 700);
  setInterval(async () => render(await (await fetch('/info')).json()), 2000);
  fetch('/info').then((r) => r.json()).then(render);
</script>
</body>
</html>
